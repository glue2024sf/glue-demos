<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大扇産業｜Salesforce デモ画面</title>
<style>
  :root{--navy:#032d60;--blue:#0176d3;--bg:#f3f3f3;--panel:#fff;--border:#dddbda;--text:#181818;--muted:#706e6b;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;font-size:15px;line-height:1.7;}
  header{background:var(--navy);color:#fff;padding:18px 20px;}
  header h1{margin:0;font-size:18px;}
  main{max-width:760px;margin:0 auto;padding:24px 16px 40px;}
  .lead{margin:0 0 20px;color:var(--muted);font-size:14px;}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;}
  a.card{display:block;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:18px;text-decoration:none;color:inherit;}
  a.card:hover{border-color:var(--blue);box-shadow:0 2px 8px rgba(1,118,211,.15);}
  .card .ico{font-size:28px;}
  .card h2{margin:6px 0 4px;font-size:17px;color:var(--blue);}
  .card p{margin:0;font-size:13px;color:var(--muted);}
  .note{margin-top:24px;padding:12px 14px;background:#fef6e6;border:1px solid #f3d19c;border-radius:6px;font-size:13px;}
</style>
</head>
<body>
<header><h1>大扇産業｜Salesforce デモ画面</h1></header>
<main>
  <p class="lead">事業部を選んでください。画面をクリックすると、各タブの内容を切り替えて見られます。</p>
  <div class="cards">
    <a class="card" href="./animal/">
      <div class="ico">🐾</div>
      <h2>アニマルヘルスケア事業部</h2>
      <p>経営会議ダッシュボード、取引先、浸透率、顧客ランクの自動判定、訪問記録からの報告書出力</p>
    </a>
    <a class="card" href="./pp/">
      <div class="ico">📦</div>
      <h2>P&amp;P事業部</h2>
      <p>顧客カルテ、受注管理表、月次会議資料、案件・見積、依頼書と期限アラート</p>
    </a>
  </div>
  <div class="note">これは実際に動くアプリではなく、画面と操作の流れをつかんでいただくためのイメージです。表示している社名・人名・数値はすべてダミーです。</div>
</main>
</body>
</html>
